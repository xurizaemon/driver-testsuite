on:
  workflow_call:
    inputs:
      name:
        description: Name of the driver test
        required: true
        type: string
      driverRepoUrl:
        description: Git URL of the driver repository
        required: true
        type: string
      driverRepoBranch:
        description: Driver repository branch to check out
        required: true
        type: string
      php:
        description: PHP version for running tests
        required: true
        type: string
      setUpCmd:
        description: Command to run before test
        required: false
        type: string
      testCmd:
        description: Command that runs the test
        required: true
        type: string
      tearDownCmd:
        description: Command to run after test
        required: false
        type: string
      repeat:
        description: Number of times to run the tests in this job (for timing samples)
        required: false
        type: number
        default: 1
      allowFailure:
        description: Whether a failing test run should leave the workflow green
        required: false
        type: boolean
        default: false

jobs:
  Test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.allowFailure }}
    steps:
      - name: Set up workspace for driver repo
        # language=bash
        run: git clone --single-branch --branch "${{ inputs.driverRepoBranch }}" "${{ inputs.driverRepoUrl }}" .

      - uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: ${{ inputs.php }}

      - name: Install driver dependencies
        # language=bash
        run: composer install --no-interaction --ansi --no-progress

      - name: Set up driver test suite as composer dependency
        # This is instead of `composer require "mink/driver-testsuite:dev-master#${{ github.sha }}"`, which works with forks
        uses: actions/checkout@v4
        with:
          path: ./vendor/mink/driver-testsuite

      - name: Set up
        # language=bash
        run: |
          mkdir ./logs
          MINK_HOST=0.0.0.0:8002 ./vendor/bin/mink-test-server &> ./logs/mink-test-server.log &
          eval "${{ inputs.setUpCmd }}"
          curl --retry 5 --retry-all-errors --retry-delay 1 --max-time 10 --head -X GET http://localhost:8002/

      - name: Run tests
        env:
          REPEAT: ${{ inputs.repeat }}
        # language=bash
        run: |
          # Every iteration runs, even after a failure; the step fails at the end if any iteration failed.
          rc=0
          for i in $(seq 1 "$REPEAT"); do
            echo "::group::Test run $i of $REPEAT"
            start=$(date +%s%N)
            eval "${{ inputs.testCmd }}" || rc=$?
            echo "run $i/$REPEAT: $(( ($(date +%s%N) - start) / 1000000 )) ms (exit ${rc})" | tee -a ./logs/timings.txt
            echo "::endgroup::"
          done
          exit $rc

      - name: Tear down
        if: always()
        # language=bash
        run: |
          eval "${{ inputs.tearDownCmd }}"

      - name: Upload logs as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.name }}-logs
          path: ./logs
